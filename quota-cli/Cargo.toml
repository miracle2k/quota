[package]
name = "quota-cli"
version = "0.2.5"
description = "Read AI usage from locally stored agent CLI credentials."
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
repository = "https://github.com/pinkpixel-dev/quota"
homepage = "https://pinkpixel.dev"
readme = "README.md"
keywords = ["usage", "quota", "claude", "codex", "herdr"]
categories = ["command-line-utilities", "development-tools"]
edition = "2021"
# `File::lock`, which the token renewal uses.
rust-version = "1.89"

[lib]
name = "quota_cli"
path = "src/lib.rs"

[[bin]]
name = "quota-cli"
path = "src/main.rs"

[dependencies]
quota-core = { path = "../quota-core", version = "0.1.3" }
chrono = "0.4"
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
